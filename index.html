<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>GX Servisní Technik</title>
    <style>
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 2px solid #444;
            background: #222;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="1024" height="576"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 1024;
        canvas.height = 576;

        let playerX = canvas.width / 2;
        const playerY = canvas.height - 140;
        const roadCenter = canvas.width / 2;
        const roadMinX = 250;
        const roadMaxX = 774;

        let score = 0;
        let gameSpeed = 4;
        let isGameOver = false;

        // Načítání obrázků s kontrolou
        const assets = {};
        const assetFiles = {
            car: 'assets/images/level1/player_car_back.png',
            road: 'assets/images/level1/road_texture.png',
            shoulder: 'assets/images/level1/shoulder_texture.png',
            bgFar: 'assets/images/level1/bg_far.png',
            bgNear: 'assets/images/level1/bg_near.png',
            trafficJam: 'assets/images/level1/obstacle_traffic_jam.png',
            roadWork: 'assets/images/level1/obstacle_road_work.png',
            police: 'assets/images/level1/obstacle_police.png',
            prostitute: 'assets/images/level1/obstacle_prostitute.png',
            coin: 'assets/images/level1/item_coin_gx.png'
        };

        for (let key in assetFiles) {
            assets[key] = new Image();
            assets[key].src = assetFiles[key];
            assets[key].onerror = () => console.error("Chybí soubor: " + assetFiles[key]);
        }

        const keys = { a: false, d: false };
        window.addEventListener('keydown', (e) => {
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = false;
        });

        let entities = [];

        function spawnEntity() {
            // Generujeme méně často a pouze nahoře na horizontu
            if (Math.random() < 0.015) {
                const types = ['trafficJam', 'roadWork', 'police', 'prostitute', 'coin'];
                const type = types[Math.floor(Math.random() * types.length)];
                const laneOffset = (Math.random() - 0.5) * 300; 

                entities.push({
                    type: type,
                    x: roadCenter + laneOffset,
                    y: 290, // Startuje přesně na horizontu silnice
                    scale: 0.02 // Začíná velmi malé v dálce
                });
            }
        }

        function update() {
            if (isGameOver) return;

            if (keys.a) playerX -= 7;
            if (keys.d) playerX += 7;

            // Omezení v rámci silnice
            if (playerX < roadMinX + 30) playerX = roadMinX + 30;
            if (playerX > roadMaxX - 30) playerX = roadMaxX - 30;

            spawnEntity();

            for (let i = entities.length - 1; i >= 0; i--) {
                let ent = entities[i];
                ent.y += gameSpeed;
                ent.scale += 0.0015 * gameSpeed; // Plynulejší přibližování

                // Výpočet pozice v perspektivě
                let targetX = roadCenter + (ent.x - roadCenter) * (ent.scale * 15);
                ent.renderX = targetX;

                // Jemnější detekce kolizí (pouze když je objekt blízko auta a ve stejném pruhu)
                if (ent.y > playerY && ent.y < playerY + 60) {
                    if (Math.abs(ent.renderX - playerX) < 40) {
                        if (ent.type === 'coin') {
                            score += 100;
                            entities.splice(i, 1);
                            continue;
                        } else {
                            isGameOver = true;
                            alert("Karambol! Zkus to znovu.");
                            location.reload();
                        }
                    }
                }

                // Odstranění, když překážka přejede hráče
                if (ent.y > canvas.height + 50) {
                    entities.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Obloha
            ctx.fillStyle = "#1b263b";
            ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
            
            if (assets.bgFar && assets.bgFar.complete && assets.bgFar.naturalWidth !== 0) {
                ctx.drawImage(assets.bgFar, 0, 50, canvas.width, 200);
            }

            // Silnice (začíná uprostřed obrazovky - horizont)
            if (assets.road && assets.road.complete && assets.road.naturalWidth !== 0) {
                ctx.drawImage(assets.road, roadMinX, canvas.height / 2, roadMaxX - roadMinX, canvas.height / 2);
            } else {
                ctx.fillStyle = "#333";
                ctx.beginPath();
                ctx.moveTo(roadCenter, canvas.height / 2);
                ctx.lineTo(roadMaxX, canvas.height);
                ctx.lineTo(roadMinX, canvas.height);
                ctx.fill();
            }

            // Překážky
            entities.sort((a, b) => a.scale - b.scale);
            entities.forEach(ent => {
                let img = assets[ent.type];
                if (img && img.complete && img.naturalWidth !== 0) {
                    let width = img.width * ent.scale * 3;
                    let height = img.height * ent.scale * 3;
                    ctx.drawImage(img, ent.renderX - width / 2, ent.y - height, width, height);
                } else {
                    ctx.fillStyle = ent.type === 'coin' ? "gold" : "red";
                    ctx.fillRect(ent.renderX - 15, ent.y - 30, 30, 30);
                }
            });

            // Hráčovo auto
            if (assets.car && assets.car.complete && assets.car.naturalWidth !== 0) {
                ctx.drawImage(assets.car, playerX - 60, playerY, 120, 120);
            } else {
                ctx.fillStyle = "#0055ff";
                ctx.fillRect(playerX - 30, playerY, 60, 90);
            }

            // Skóre
            ctx.fillStyle = "#ffffff";
            ctx.font = "20px Arial";
            ctx.fillText("SKÓRE: " + score, 30, 40);
        }

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    gameLoop();
    </script>
</body>
</html>
