<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>GX Servisní Technik</title>
    <style>
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 2px solid #444;
            background: #1b263b;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="1024" height="576"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Nastavení horizontu a silnice
        const horizonY = 250;
        const roadCenter = canvas.width / 2;
        const roadMinX = 280;
        const roadMaxX = 744;

        let playerX = canvas.width / 2;
        const playerY = canvas.height - 120;

        let score = 0;
        let gameSpeed = 2.5;
        let isGameOver = false;

        // Funkce pro automatické odstranění zeleného pozadí (chroma-key)
        function removeGreenBackground(img) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = img.width;
            tempCanvas.height = img.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(img, 0, 0);

            try {
                const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i];
                    let g = data[i + 1];
                    let b = data[i + 2];

                    if (g > 100 && g > r + 40 && g > b + 40) {
                        data[i + 3] = 0; // Průhledno
                    }
                }
                tempCtx.putImageData(imgData, 0, 0);
            } catch (e) {
                console.error("Chyba při zpracování obrazu:", e);
            }
            return tempCanvas;
        }

        const assets = {};
        const assetFiles = {
            car: 'assets/images/level1/player_car_back.png',
            road: 'assets/images/level1/road_texture.png',
            shoulder: 'assets/images/level1/shoulder_texture.png',
            bgFar: 'assets/images/level1/bg_far.png',
            bgNear: 'assets/images/level1/bg_near.png',
            trafficJam: 'assets/images/level1/obstacle_traffic_jam.png',
            roadWork: 'assets/images/level1/obstacle_road_work.png',
            police: 'assets/images/level1/obstacle_police.png',
            prostitute: 'assets/images/level1/obstacle_prostitute.png',
            coin: 'assets/images/level1/item_coin_gx.png'
        };

        // Načtení a očištění obrázků
        for (let key in assetFiles) {
            let img = new Image();
            img.src = assetFiles[key];
            img.onload = () => {
                assets[key] = removeGreenBackground(img);
            };
            assets[key] = img; 
        }

        const keys = { a: false, d: false };
        window.addEventListener('keydown', (e) => {
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = false;
        });

        let entities = [];

        function spawnEntity() {
            if (Math.random() < 0.015 && entities.length < 5) {
                const types = ['trafficJam', 'roadWork', 'police', 'prostitute', 'coin'];
                const type = types[Math.floor(Math.random() * types.length)];
                
                // Náhodná pozice v rámci šířki silnice v dálce
                const laneOffset = (Math.random() - 0.5) * 180; 

                entities.push({
                    type: type,
                    laneOffset: laneOffset, // Relativní pozice vůči středu silnice
                    y: horizonY,            // Start přesně na horizontu
                });
            }
        }

        function update() {
            if (isGameOver) return;

            if (keys.a) playerX -= 6;
            if (keys.d) playerX += 6;

            // Omezení pohybu auta v rámci silnice
            if (playerX < roadMinX + 30) playerX = roadMinX + 30;
            if (playerX > roadMaxX - 30) playerX = roadMaxX - 30;

            spawnEntity();

            for (let i = entities.length - 1; i >= 0; i--) {
                let ent = entities[i];
                
                // Pohyb kupředu (zrychluje směrem k dolnímu okraji)
                ent.y += gameSpeed;
                gameSpeed += 0.0003; // Postupné zrychlování hry

                // Výpočet perspektivy (faktor zvětšení 0.0 na horizontu až 1.0 u hráče)
                let distanceFactor = (ent.y - horizonY) / (canvas.height - horizonY);
                if (distanceFactor < 0) distanceFactor = 0;

                // Šířka silnice se rozšiřuje směrem dolů
                let currentRoadWidthAtY = roadMinX + (roadMaxX - roadMinX) * distanceFactor;
                let currentRoadCenter = roadCenter; // Může se upravit pro zatáčky, teď drží střed
                
                ent.renderX = currentRoadCenter + ent.laneOffset * (0.2 + 0.8 * distanceFactor);

                // Velikost objektu podle vzdálenosti
                let scale = 0.1 + distanceFactor * 0.9;
                ent.renderScale = scale;

                // Detekce kolize s hráčem
                if (ent.y > playerY - 30 && ent.y < playerY + 20) {
                    if (Math.abs(ent.renderX - playerX) < 45) {
                        if (ent.type === 'coin') {
                            score += 100;
                            entities.splice(i, 1);
                            continue;
                        } else {
                            isGameOver = true;
                            alert("Karambol! Skóre: " + score + "\nZkus to znovu.");
                            location.reload();
                        }
                    }
                }

                // Odstranění, když objekt odjede mimo obrazovku dole
                if (ent.y > canvas.height + 50) {
                    entities.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Obloha
            ctx.fillStyle = "#1b263b";
            ctx.fillRect(0, 0, canvas.width, horizonY);
            
            if (assets.bgFar) {
                ctx.drawImage(assets.bgFar, 0, horizonY - 100, canvas.width, 100);
            }

            // Silnice (jednoduchý lichoběžník od horizontu dolů)
            ctx.fillStyle = "#333";
            ctx.beginPath();
            ctx.moveTo(roadCenter - (roadMaxX - roadMinX) * 0.15, horizonY);
            ctx.lineTo(roadCenter + (roadMaxX - roadMinX) * 0.15, horizonY);
            ctx.lineTo(roadMaxX, canvas.height);
            ctx.lineTo(roadMinX, canvas.height);
            ctx.closePath();
            ctx.fill();

            if (assets.road) {
                // Pokud je k dispozici textura silnice, lze ji vykreslit
                // Prozatím držíme čistý základ
            }

            // Vykreslení překážek (seřazené od nejvzdálenějších po nejbližší kvůli překryvu)
            entities.sort((a, b) => a.y - b.y);
            entities.forEach(ent => {
                let img = assets[ent.type];
                if (img) {
                    let baseWidth = img.width * 0.35;
                    let baseHeight = img.height * 0.35;
                    let width = baseWidth * ent.renderScale;
                    let height = baseHeight * ent.renderScale;
                    
                    ctx.drawImage(img, ent.renderX - width / 2, ent.y - height, width, height);
                }
            });

            // Hráčovo auto (dole na obrazovce)
            if (assets.car) {
                ctx.drawImage(assets.car, playerX - 55, playerY - 30, 110, 110);
            }

            // Skóre
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 24px Arial";
            ctx.fillText("SKÓRE: " + score, 30, 45);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
