<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>GX Servisní Technik</title>
    <style>
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 2px solid #444;
            background: #1b263b;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas" width="1024" height="576"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 1024;
        canvas.height = 576;

        let playerX = canvas.width / 2;
        const playerY = canvas.height - 130;
        const roadCenter = canvas.width / 2;
        const roadMinX = 280;
        const roadMaxX = 744;

        let score = 0;
        let gameSpeed = 3.5;
        let isGameOver = false;

        // Funkcja pro automatické odstranění zeleného pozadí (chroma-key)
        function removeGreenBackground(img) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = img.width;
            tempCanvas.height = img.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(img, 0, 0);

            try {
                const imgData = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i];
                    let g = data[i + 1];
                    let b = data[i + 2];

                    // Pokud je pixel výrazně zelený, nastavíme ho jako průhledný
                    if (g > 100 && g > r + 40 && g > b + 40) {
                        data[i + 3] = 0; // Alpha kanál na 0 (průhledno)
                    }
                }
                tempCtx.putImageData(imgData, 0, 0);
            } catch (e) {
                console.error("Chyba při zpracování obrazu:", e);
            }
            return tempCanvas;
        }

        const assets = {};
        const assetFiles = {
            car: 'assets/images/level1/player_car_back.png',
            road: 'assets/images/level1/road_texture.png',
            shoulder: 'assets/images/level1/shoulder_texture.png',
            bgFar: 'assets/images/level1/bg_far.png',
            bgNear: 'assets/images/level1/bg_near.png',
            trafficJam: 'assets/images/level1/obstacle_traffic_jam.png',
            roadWork: 'assets/images/level1/obstacle_road_work.png',
            police: 'assets/images/level1/obstacle_police.png',
            prostitute: 'assets/images/level1/obstacle_prostitute.png',
            coin: 'assets/images/level1/item_coin_gx.png'
        };

        // Načtení a automatické očištění obrázků od zelené barvy
        for (let key in assetFiles) {
            let img = new Image();
            img.src = assetFiles[key];
            img.onload = () => {
                assets[key] = removeGreenBackground(img);
            };
            assets[key] = img; // Dočasná náhrada, než se obrázek načte
        }

        const keys = { a: false, d: false };
        window.addEventListener('keydown', (e) => {
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = true;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.a = false;
            if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.d = false;
        });

        let entities = [];

        function spawnEntity() {
            if (Math.random() < 0.012) {
                const types = ['trafficJam', 'roadWork', 'police', 'prostitute', 'coin'];
                const type = types[Math.floor(Math.random() * types.length)];
                const laneOffset = (Math.random() - 0.5) * 250; 

                entities.push({
                    type: type,
                    x: roadCenter + laneOffset,
                    y: 280, // Start na horizontu
                    scale: 0.01 // Malé v dálce
                });
            }
        }

        function update() {
            if (isGameOver) return;

            if (keys.a) playerX -= 6;
            if (keys.d) playerX += 6;

            if (playerX < roadMinX + 20) playerX = roadMinX + 20;
            if (playerX > roadMaxX - 20) playerX = roadMaxX - 20;

            spawnEntity();

            for (let i = entities.length - 1; i >= 0; i--) {
                let ent = entities[i];
                ent.y += gameSpeed;
                ent.scale += 0.0012 * gameSpeed;

                let targetX = roadCenter + (ent.x - roadCenter) * (ent.scale * 12);
                ent.renderX = targetX;

                // Detekce kolize
                if (ent.y > playerY - 10 && ent.y < playerY + 40) {
                    if (Math.abs(ent.renderX - playerX) < 35) {
                        if (ent.type === 'coin') {
                            score += 100;
                            entities.splice(i, 1);
                            continue;
                        } else {
                            isGameOver = true;
                            alert("Karambol! Zkus to znovu.");
                            location.reload();
                        }
                    }
                }

                if (ent.y > canvas.height + 50) {
                    entities.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Obloha
            ctx.fillStyle = "#1b263b";
            ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
            
            if (assets.bgFar) {
                ctx.drawImage(assets.bgFar, 0, 30, canvas.width, 220);
            }

            // Silnice
            if (assets.road) {
                ctx.drawImage(assets.road, roadMinX, canvas.height / 2, roadMaxX - roadMinX, canvas.height / 2);
            }

            // Překážky
            entities.sort((a, b) => a.scale - b.scale);
            entities.forEach(ent => {
                let img = assets[ent.type];
                if (img) {
                    let width = img.width * ent.scale * 1.5;
                    let height = img.height * ent.scale * 1.5;
                    ctx.drawImage(img, ent.renderX - width / 2, ent.y - height, width, height);
                }
            });

            // Hráčovo auto
            if (assets.car) {
                ctx.drawImage(assets.car, playerX - 50, playerY, 100, 100);
            }

            // Skóre
            ctx.fillStyle = "#ffffff";
            ctx.font = "22px Arial";
            ctx.fillText("SKÓRE: " + score, 30, 40);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
